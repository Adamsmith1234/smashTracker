<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Smash Tracker</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="characters.js"></script>
    <script src="script.js" defer></script>
</head>
<iframe name="hidden_iframe" style="display:none;"></iframe>
<body>

<div class="app-shell">

    <div class="nav">
        <button class="navButton" aria-label="Home" onclick="location.href='index.html'">
            <span class="material-symbols-outlined">home</span>
        </button>
        <button class="navButton" aria-label="Stats" onclick="location.href='stats.html'">
            <span class="material-symbols-outlined">bar_chart</span>
        </button>
    </div>

    <h1>Smash Tracker</h1>

    <div class="container">

    <div class="player">

        <h2>Adam</h2>

        <select id="adamChar"></select>

        <button class="stock green" onclick="submitMatch('Adam',3)">3</button>
        <button class="stock yellow" onclick="submitMatch('Adam',2)">2</button>
        <button class="stock red" onclick="submitMatch('Adam',1)">1</button>

    </div>

    <div class="player">

        <h2>Justin</h2>

        <select id="justinChar"></select>

        <button class="stock green" onclick="submitMatch('Justin',3)">3</button>
        <button class="stock yellow" onclick="submitMatch('Justin',2)">2</button>
        <button class="stock red" onclick="submitMatch('Justin',1)">1</button>

    </div>

</div>

<div id="status"></div>

</div>

</body>
</html>
